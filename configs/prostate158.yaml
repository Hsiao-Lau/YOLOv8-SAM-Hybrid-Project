dataset:
  name: prostate158
  task: slice_based_prostate_mri_segmentation
  classes: [CG, PZ, PCa]
  image_size: 512
  detector_input_size: 640
  mask_threshold: 0.52
  min_component_area: 64
  opening_kernel: 3
  closing_kernel: 5
  gaussian_sigma: 1.0
  pixel_spacing_mm: [1.0, 1.0]

detector:
  model_size: yolov8m
  initialization: yolov8m.pt
  input_size: 640
  batch_size: 16
  learning_rate: 0.001
  epochs: 96
  patience: 18
  confidence_threshold: 0.27
  nms_iou_threshold: 0.52
  project: runs/prostate158/yolo

prompt:
  t_medium: 1024
  t_large: 9216
  negative_points: 2
  safety_distance: 8
  deterministic: true
  seed: 17821

sam:
  backbone: vit_b
  checkpoint: weights/sam_vit_b_01ec64.pth
  freeze_image_encoder: true
  train_prompt_encoder: true
  train_mask_decoder: true
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 4
  epochs: 50
  patience: 10
  lambda_dice: 0.5
  lambda_focal: 0.5
  focal_alpha: 0.25
  focal_gamma: 2.0

runtime:
  device: auto
  seed: 17821
  output_dir: runs/prostate158/yolo_sam_hybrid
