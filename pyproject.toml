[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-sam-hybrid"
version = "0.1.0"
description = "Slice-based YOLO-SAM hybrid prompting framework for medical image segmentation"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "YOLO-SAM Hybrid Framework Authors"}]
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.8",
    "Pillow>=9.5",
    "PyYAML>=6.0",
    "pandas>=1.5",
    "scipy>=1.10",
    "scikit-image>=0.20",
    "matplotlib>=3.7",
    "tqdm>=4.65"
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics==8.0.196",
    "monai>=1.2"
]
sam = [
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git"
]
dev = ["pytest>=7.0", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["yolo_sam_hybrid*"]
